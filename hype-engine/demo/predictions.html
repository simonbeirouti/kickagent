<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Predictions · Hype Engine</title>
<style>
  :root { color-scheme: dark; --green:#53fc18; --bg:#0b0e0c; --surface:#181d25; --border:#2d3542; --text:#f2f5f0; --muted:#9fb0c9; --red:#ff6565; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,sans-serif; }
  .shell { width:min(1180px,calc(100% - 32px)); margin:0 auto; padding:36px 0 64px; }
  header { display:flex; align-items:flex-start; justify-content:space-between; gap:24px; margin-bottom:28px; }
  h1 { margin:0 0 8px; color:var(--green); font-size:clamp(2rem,5vw,4rem); letter-spacing:-.04em; }
  .subtitle { margin:0; color:var(--muted); font-size:1.05rem; }
  .back { color:var(--text); text-decoration:none; border:1px solid var(--border); border-radius:9px; padding:10px 14px; white-space:nowrap; }
  .back:hover { border-color:var(--green); }
  .panel { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:22px; }
  .panel-top { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-bottom:20px; }
  .panel-top h2 { margin:0; font-size:1rem; text-transform:uppercase; letter-spacing:.14em; color:var(--green); }
  .identity { color:var(--muted); }
  .identity strong { margin-left:8px; color:var(--text); }
  #predictions { display:grid; gap:10px; }
  .prediction { border:1px solid var(--border); background:rgba(11,14,12,.28); border-radius:14px; padding:20px; }
  .prediction-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:6px; }
  .question { margin:0; font-size:clamp(1.15rem,2.3vw,1.55rem); line-height:1.3; }
  .status { border:1px solid var(--border); border-radius:999px; padding:3px 7px; font-size:.62rem; font-weight:800; letter-spacing:.05em; text-transform:uppercase; white-space:nowrap; }
  .status.open { color:var(--green); border-color:rgba(83,252,24,.45); background:rgba(83,252,24,.08); }
  .status.scheduled { color:#ffbd4a; border-color:rgba(255,189,74,.45); }
  .status.locked { color:var(--red); border-color:rgba(255,101,101,.45); }
  .time-row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:5px; color:var(--muted); font-size:.7rem; }
  .time-row strong { color:var(--text); font-variant-numeric:tabular-nums; }
  .time-bar { height:5px; margin-bottom:10px; border-radius:999px; overflow:hidden; background:rgb(255 255 255 / 9%); }
  .time-bar-fill { height:100%; border-radius:inherit; background:linear-gradient(90deg,#25a70d,var(--green)); transition:width .25s linear; }
  .options { display:grid; gap:7px; }
  .option { position:relative; min-height:44px; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:#0d1015; }
  .option.winner { border-color:var(--option-color); box-shadow:0 0 0 1px var(--option-color),0 0 22px color-mix(in srgb,var(--option-color) 22%,transparent); }
  .fill { position:absolute; inset:0 auto 0 0; width:var(--share); background:color-mix(in srgb,var(--option-color) 24%,transparent); }
  .option-content { position:relative; display:grid; grid-template-columns:minmax(50px,1fr) auto auto auto; align-items:center; gap:8px; min-height:44px; padding:0 8px; }
  .option-name { color:var(--option-color); font-size:.88rem; font-weight:800; text-transform:uppercase; }
  .points { color:var(--muted); font-size:.72rem; font-variant-numeric:tabular-nums; }
  .percent { color:var(--option-color); font-size:.92rem; font-weight:800; font-variant-numeric:tabular-nums; }
  .stake-row { display:flex; align-items:center; justify-content:flex-end; gap:6px; margin-bottom:7px; color:var(--muted); font-size:.7rem; }
  .stake-input { width:58px; padding:4px 6px; border:1px solid var(--border); border-radius:6px; background:#0d1015; color:var(--text); font:inherit; font-variant-numeric:tabular-nums; }
  .vote-controls { display:flex; gap:3px; }
  .vote-button { width:25px; height:25px; border:1px solid var(--border); border-radius:6px; padding:0; background:#10141a; color:var(--text); font-size:.85rem; cursor:pointer; }
  .vote-button:hover:not(:disabled),.vote-button.active { border-color:var(--option-color); color:var(--option-color); }
  .vote-button.active { background:color-mix(in srgb,var(--option-color) 14%,#10141a); }
  .vote-button:disabled { cursor:not-allowed; opacity:.45; }
  .totals { display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:9px; color:var(--muted); font-size:.72rem; }
  .totals strong { color:var(--text); font-variant-numeric:tabular-nums; }
  @media (max-width:650px) {
    .shell { width:min(100% - 20px,1180px); padding-top:22px; }
    header,.prediction-head { flex-direction:column; }
    .panel { padding:12px; } .prediction { padding:15px; }
    .option-content { grid-template-columns:1fr auto auto; gap:8px 10px; padding:10px 12px; }
    .points { grid-column:1/3; grid-row:2; }
  }
  body.embed .shell { width:100%; padding:8px; }
  html.embed,body.embed { background:transparent; }
  body.embed header { display:none; }
  body.embed .panel { border:0; background:transparent; padding:0; }
  body.embed .panel-top { display:none; }
  body.embed .prediction { padding:10px; background:var(--surface); backdrop-filter:none; box-shadow:0 14px 40px rgb(0 0 0 / 45%); }
  body.embed .question { font-size:.9rem; }
  body.embed .time-bar { margin-bottom:9px; }
  body.embed .option-content { grid-template-columns:minmax(45px,1fr) auto auto auto; gap:7px; padding:0 7px; }
  body.embed .points { grid-column:auto; grid-row:auto; }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div>
      <h1>Predictions &amp; Bets 🟢</h1>
      <p class="subtitle">Live questions, option pools, points, percentages, and participation.</p>
    </div>
    <a class="back" href="/demo/">← Hype dashboard</a>
  </header>
  <main class="panel">
    <div class="panel-top"><h2>Prediction pools</h2><div class="identity">Viewing as <strong>HypeKing</strong></div></div>
    <div id="predictions" aria-live="polite"></div>
  </main>
</div>
<script type="module">
import { createMockPredictions, summarizePrediction } from '../src/predictions.js';

if (new URLSearchParams(window.location.search).get('embed') === '1') {
  document.documentElement.classList.add('embed');
  document.body.classList.add('embed');
}

const source = createMockPredictions();
const colors = ['#53fc18','#ff6565','#63a8ff','#ffbd4a'];
const number = new Intl.NumberFormat('en-US');
let simulatedVoter = 0;
let stakeAmount = 50;
const escapeHtml = (value) => String(value).replace(/[&<>'"]/g,(char)=>({
  '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'
})[char]);

function relative(target, now) {
  let seconds = Math.max(0,Math.ceil((Date.parse(target)-now)/1000));
  const hours = Math.floor(seconds/3600); seconds %= 3600;
  const minutes = Math.floor(seconds/60); const remainder = seconds%60;
  return [hours&&`${hours}h`,(minutes||hours)&&`${minutes}m`,`${remainder}s`].filter(Boolean).join(' ');
}

function render() {
  const now = Date.now();
  const predictions = source.map((prediction)=>summarizePrediction(prediction,now));
  document.getElementById('predictions').innerHTML = predictions.map((prediction,predictionIndex)=>{
    const duration = Math.max(1,Date.parse(prediction.locksAt)-Date.parse(prediction.opensAt));
    const remaining = Math.max(0,Date.parse(prediction.locksAt)-now);
    const remainingPercent = Math.min(100,Math.max(0,(remaining/duration)*100));
    const winningPoints = Math.max(...prediction.options.map((option)=>option.points));
    const visibleOptions = prediction.status==='locked'
      ? prediction.options.filter((option)=>option.points===winningPoints)
      : prediction.options;
    const countdown = prediction.status==='scheduled' ? `Opens in ${relative(prediction.opensAt,now)}`
      : prediction.status==='open' ? `Locks in ${relative(prediction.locksAt,now)}` : 'Betting locked';
    return `<article class="prediction">
      <div class="prediction-head"><h3 class="question">🏆 ${escapeHtml(prediction.question)}</h3><span class="status ${prediction.status}">${countdown}</span></div>
      <div class="time-row"><span>Voting time</span><strong>${prediction.status==='locked'?'Voting locked':`${relative(prediction.locksAt,now)} remaining`}</strong></div>
      <div class="time-bar" role="progressbar" aria-label="Voting time remaining" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(remainingPercent)}"><div class="time-bar-fill" style="width:${remainingPercent}%"></div></div>
      <label class="stake-row">Points per vote <input class="stake-input" type="number" min="1" step="10" value="${stakeAmount}" ${prediction.status==='open'?'':'disabled'}></label>
      <div class="options">${visibleOptions.map((option)=>{
        const index = prediction.options.findIndex((candidate)=>candidate.id===option.id);
        const viewerPoints = source[predictionIndex].viewerPoints(option.id);
        return `
        <div class="option ${prediction.status==='locked'?'winner':''}" style="--share:${option.percentage}%;--option-color:${colors[index%colors.length]}">
          <div class="fill"></div><div class="option-content"><span class="option-name">${escapeHtml(option.label)}</span><span class="points">${number.format(option.points)} pts${viewerPoints?` · yours ${number.format(viewerPoints)}`:''}</span><span class="percent">${option.percentage}%</span><span class="vote-controls"><button class="vote-button ${viewerPoints?'active':''}" data-action="remove" data-prediction="${predictionIndex}" data-option="${index}" aria-label="Remove points from ${escapeHtml(option.label)}" ${prediction.status==='open'&&viewerPoints?'':'disabled'}>−</button><button class="vote-button" data-action="add" data-prediction="${predictionIndex}" data-option="${index}" aria-label="Add points to ${escapeHtml(option.label)}" ${prediction.status==='open'?'':'disabled'}>+</button></span></div>
        </div>`}).join('')}</div>
      <footer class="totals"><span>Total pool <strong>${number.format(prediction.totalPoints)} points</strong></span><span>Participants <strong>${number.format(prediction.participantCount)}</strong></span></footer>
    </article>`;
  }).join('');
  requestAnimationFrame(()=>{
    const card = document.querySelector('.prediction');
    if (card && window.parent!==window) {
      window.parent.postMessage({ type:'prediction-size',height:Math.ceil(card.getBoundingClientRect().height)+16 },window.location.origin);
    }
  });
}

render();
setInterval(render,1000);
setInterval(()=>{
  const now = Date.now();
  let changed = false;
  for (const prediction of source) {
    if (summarizePrediction(prediction,now).status!=='open' || Math.random()>0.9) continue;
    const option = prediction.options[Math.floor(Math.random()*prediction.options.length)];
    prediction.vote(option.id,{ voterId:`simulated-viewer-${++simulatedVoter}`,points:50,now });
    changed = true;
  }
  if (changed) render();
},500);
document.getElementById('predictions').addEventListener('click',(event)=>{
  const button = event.target.closest('.vote-button');
  if (!button) return;
  const prediction = source[Number(button.dataset.prediction)];
  const option = prediction?.options[Number(button.dataset.option)];
  if (prediction && option) prediction.vote(option.id,{ points:stakeAmount,action:button.dataset.action });
  render();
});
document.getElementById('predictions').addEventListener('input',(event)=>{
  if (!event.target.matches('.stake-input')) return;
  stakeAmount = Math.max(1,Math.round(Number(event.target.value)||1));
});
</script>
</body>
</html>
